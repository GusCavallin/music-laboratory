<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 880" width="1250" height="880" role="img" aria-labelledby="t d">
  <title id="t">Music Hub in React: how the parts work together</title>
  <desc id="d">build_data.py reads the iTunes library file, read-only, and writes data.js. The React helper, server.py on port 9223, builds the page with Vite when it is out of date and serves it with data.js, using the shared helper.py. The app in the browser is four layers: components, hooks and services, state, and plain logic. Every request to the helper goes through api/helper.ts: playing songs, saving playlists and presets, rebuilding the data, and star ratings, which go through the itunes-com scripts to the running iTunes. iTunes rewrites the library file and Refresh data reads it again. The app remembers its view in localStorage and can be installed as an app through a manifest and a service worker that caches nothing.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3e4c59"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .h1 { font-size: 20px; font-weight: 600; }
      .sub { font-size: 12.5px; fill: #52606d; }
      .name { font-size: 14px; font-weight: 600; }
      .t { font-size: 11.5px; }
      .s { font-size: 11.5px; fill: #52606d; }
      .xs { font-size: 10.5px; fill: #52606d; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 11px; }
      .lbl { font-size: 11.5px; fill: #3e4c59; }
      .lc { fill: #e8f1fd; stroke: #3b7dd8; stroke-width: 1.5; }
      .tp { fill: #fdf0dc; stroke: #d08a1e; stroke-width: 1.5; }
      .tpi { fill: #ffffff; stroke: #d08a1e; stroke-width: 1; }
      .ut { fill: #e6f6ea; stroke: #3c9a5f; stroke-width: 1.5; }
      .ex { fill: #f3f4f6; stroke: #8a8f98; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .box { fill: #fafbfc; stroke: #b9c4d3; stroke-width: 1.5; }
      .a { fill: none; stroke: #3e4c59; stroke-width: 1.5; marker-end: url(#arrow); }
      .ab { fill: none; stroke: #3e4c59; stroke-width: 1.5; marker-end: url(#arrow); marker-start: url(#arrow); }
      .ad { fill: none; stroke: #3e4c59; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .badge { fill: #1f2933; }
      .bt { font-size: 11px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1249" height="879" rx="10" fill="#ffffff" stroke="#d9dde3"/>

  <text x="40" y="46" class="h1">Music Hub in React: how the parts work together</text>
  <text x="40" y="68" class="sub">Follow the numbers 1 to 6: from your iTunes library to the React page, and back again when you rate a song. Step 6 feeds step 1.</text>

  <!-- ===== Column A: your files and iTunes ===== -->
  <rect x="40" y="110" width="210" height="80" rx="6" class="ex"/>
  <text x="54" y="134" class="name">iTunes library</text>
  <text x="54" y="153" class="s">iTunes Music Library.xml</text>
  <text x="54" y="170" class="s">read-only for every tool</text>

  <rect x="40" y="215" width="210" height="80" rx="6" class="tp"/>
  <text x="54" y="239" class="name">build_data.py</text>
  <text x="54" y="258" class="s">in tools/music-hub-core</text>
  <text x="54" y="278" class="t">years, genres, tempo, Feel, CDs</text>

  <rect x="40" y="320" width="210" height="50" rx="6" class="tpi"/>
  <text x="54" y="342" class="code">data.js</text>
  <text x="54" y="359" class="xs">generated, not committed</text>

  <rect x="40" y="395" width="210" height="45" rx="6" class="tpi"/>
  <text x="54" y="415" class="code">presets.json</text>
  <text x="54" y="431" class="xs">saved views, shared with the vanilla page</text>

  <rect x="40" y="455" width="210" height="55" rx="6" class="tpi"/>
  <text x="54" y="475" class="code">playlists\[Gen] name.m3u8</text>
  <text x="54" y="492" class="xs">you import them into iTunes yourself</text>

  <rect x="40" y="540" width="210" height="110" rx="6" class="ex"/>
  <text x="54" y="564" class="name">iTunes (desktop)</text>
  <text x="54" y="583" class="s">has to be running</text>
  <text x="54" y="604" class="s">the only change Music Hub</text>
  <text x="54" y="621" class="s">makes is a song's star rating</text>

  <!-- 1: build_data reads the library and writes data.js -->
  <path d="M145 190 V215" class="a"/>
  <circle cx="165" cy="203" r="9" class="badge"/><text x="165" y="207" class="bt">1</text>
  <text x="180" y="207" class="lbl">reads</text>
  <path d="M145 295 V320" class="a"/>
  <text x="160" y="312" class="lbl">writes</text>

  <!-- ===== Column B: the helper ===== -->
  <rect x="330" y="110" width="290" height="125" rx="6" class="tp"/>
  <text x="346" y="134" class="name">server.py</text>
  <text x="346" y="153" class="s">tools/music-hub-react · port 9223</text>
  <text x="346" y="177" class="t">builds dist\ first if it is missing or</text>
  <text x="346" y="194" class="t">older than the source, serves it (page,</text>
  <text x="346" y="211" class="t">assets, manifest, sw.js) and stops</text>
  <text x="346" y="228" class="t">when the window closes</text>

  <rect x="330" y="255" width="290" height="215" rx="6" class="tp"/>
  <text x="346" y="279" class="name">helper.py</text>
  <text x="346" y="298" class="s">in tools/music-hub-core, shared by both pages</text>
  <text x="346" y="323" class="code">/data.js    the library, never cached</text>
  <text x="346" y="340" class="code">/audio      plays a song, with seeking</text>
  <text x="346" y="357" class="code">/rate       sets one song's stars</text>
  <text x="346" y="374" class="code">/playlist   writes a [Gen] .m3u8 file</text>
  <text x="346" y="391" class="code">/presets    saved views</text>
  <text x="346" y="408" class="code">/rebuild    runs build_data</text>
  <text x="346" y="425" class="code">/version · /ping</text>
  <text x="346" y="442" class="code">/presence   closes it with the window</text>

  <rect x="330" y="540" width="290" height="110" rx="6" class="ut"/>
  <text x="346" y="564" class="name">itunes-com</text>
  <text x="346" y="583" class="s">PowerShell · desktop iTunes only</text>
  <text x="346" y="607" class="code">rate_file.ps1   one song's stars</text>
  <text x="346" y="624" class="code">[To Rate] lists: takes the song off</text>

  <!-- 2: the helper reads data.js; 6: a rating goes to iTunes -->
  <path d="M250 345 H330" class="a"/>
  <circle cx="268" cy="329" r="9" class="badge"/><text x="268" y="333" class="bt">2</text>
  <text x="283" y="333" class="lbl">read by</text>
  <path d="M330 417 H250" class="ab"/>
  <text x="290" y="409" class="lbl" text-anchor="middle">reads, writes</text>
  <path d="M330 466 H250" class="a"/>
  <text x="290" y="458" class="lbl" text-anchor="middle">writes</text>
  <path d="M475 470 V540" class="a"/>
  <circle cx="495" cy="505" r="9" class="badge"/><text x="495" y="509" class="bt">6</text>
  <text x="510" y="509" class="lbl">POST /rate</text>
  <path d="M330 595 H250" class="a"/>
  <text x="290" y="587" class="lbl" text-anchor="middle">COM</text>

  <!-- iTunes rewrites the library file: back to step 1 -->
  <path d="M40 600 H28 V150 H40" class="ad"/>
  <text transform="translate(14 375) rotate(-90)" class="lbl" text-anchor="middle">iTunes rewrites the library file; Refresh data reads it again</text>

  <!-- ===== Column C: the app in the browser ===== -->
  <rect x="680" y="100" width="535" height="710" rx="8" class="box"/>
  <text x="700" y="121" class="name" style="font-size:15px">In the browser: the React app (src/)</text>

  <rect x="700" y="135" width="340" height="140" rx="6" class="tp"/>
  <text x="716" y="158" class="name">Components</text>
  <text x="716" y="176" class="s">src/components, App.tsx · show state, send actions</text>
  <text x="716" y="201" class="code">Tabs  SearchBar  FilterRow  DataTable</text>
  <text x="716" y="218" class="code">FeelPanel  GraphPanel  CubeControls</text>
  <text x="716" y="235" class="code">PlayerBar  Stars  PresetsControl</text>
  <text x="716" y="252" class="code">ColumnMenu  TipLayer  AboutDialog</text>

  <rect x="700" y="300" width="340" height="135" rx="6" class="tp"/>
  <text x="716" y="323" class="name">Hooks and services</text>
  <text x="716" y="341" class="s">the only code that talks to the outside</text>
  <text x="716" y="366" class="code">useLibrary  useHelper  usePresets</text>
  <text x="716" y="383" class="code">useAudioPlayer     the &lt;audio&gt; element</text>
  <text x="716" y="400" class="code">rating  saveFlow   stars, Save as playlist</text>
  <text x="716" y="417" class="code">api/helper.ts      every request to the helper</text>

  <rect x="700" y="460" width="340" height="115" rx="6" class="tp"/>
  <text x="716" y="483" class="name">State</text>
  <text x="716" y="501" class="s">plain reducers · src/state and player/queue.ts</text>
  <text x="716" y="526" class="code">uiState (tab, filters, sort) · history (← back)</text>
  <text x="716" y="543" class="code">session · columnPrefs · legacy (stored keys)</text>
  <text x="716" y="560" class="code">queue (the playing list, shuffle)</text>

  <rect x="700" y="600" width="340" height="100" rx="6" class="tp"/>
  <text x="716" y="623" class="name">Plain logic</text>
  <text x="716" y="641" class="s">functions with no React, tested without a browser</text>
  <text x="716" y="666" class="code">data/  load  text  filter  feel  options  mutate</text>
  <text x="716" y="683" class="code">feel/  pairs  cube  model  project  draw</text>

  <path d="M870 270 V300" class="a"/>
  <circle cx="890" cy="287" r="9" class="badge"/><text x="890" y="291" class="bt">4</text>
  <text x="905" y="291" class="lbl">a click becomes an action</text>
  <path d="M870 435 V460" class="a"/>
  <path d="M870 575 V600" class="a"/>

  <rect x="1060" y="135" width="140" height="140" rx="6" class="tp"/>
  <text x="1074" y="158" class="name">Installable</text>
  <text x="1074" y="180" class="t">pwa.ts registers</text>
  <text x="1074" y="197" class="code">public/sw.js</text>
  <text x="1074" y="214" class="t">(caches nothing)</text>
  <text x="1074" y="238" class="t">and a manifest, so</text>
  <text x="1074" y="255" class="t">it installs as an app</text>

  <rect x="1060" y="460" width="140" height="115" rx="6" class="ex"/>
  <text x="1074" y="483" class="name">localStorage</text>
  <text x="1074" y="505" class="code">ls_session</text>
  <text x="1074" y="522" class="code">ls_hidden ls_order</text>
  <text x="1074" y="539" class="code">ls_volume</text>
  <text x="1074" y="561" class="xs">same keys as vanilla</text>
  <path d="M1040 517 H1060" class="ab"/>

  <rect x="700" y="725" width="500" height="70" rx="6" class="lc"/>
  <text x="716" y="749" class="name">Vite</text>
  <text x="716" y="768" class="s">npm run build writes dist\ (server.py runs it when it is needed)</text>
  <text x="716" y="785" class="s">npm run dev: src\ on port 5273, helper routes handed on to 9223</text>

  <!-- 3: the page and data.js; 5: requests to the helper -->
  <path d="M620 175 H700" class="a"/>
  <circle cx="634" cy="159" r="9" class="badge"/><text x="634" y="163" class="bt">3</text>
  <text x="647" y="163" class="lbl">page</text>
  <text x="650" y="194" class="lbl" text-anchor="middle">+ data.js</text>
  <path d="M620 365 H700" class="ab"/>
  <circle cx="640" cy="349" r="9" class="badge"/><text x="640" y="353" class="bt">5</text>
  <text x="654" y="353" class="lbl">fetch</text>

  <!-- ===== Legend ===== -->
  <path d="M40 830 H1210" stroke="#d9dde3" stroke-width="1"/>
  <rect x="40" y="842" width="14" height="14" rx="3" class="tp"/>
  <text x="61" y="854" class="s">Music Hub</text>
  <rect x="160" y="842" width="14" height="14" rx="3" class="lc"/>
  <text x="181" y="854" class="s">build and development tool</text>
  <rect x="380" y="842" width="14" height="14" rx="3" class="ut"/>
  <text x="401" y="854" class="s">talks to iTunes</text>
  <rect x="520" y="842" width="14" height="14" rx="3" class="ex"/>
  <text x="541" y="854" class="s">outside the program</text>
  <path d="M700 849 H740" class="a"/>
  <text x="748" y="854" class="s">calls, writes a file or hands over</text>
  <path d="M960 849 H1000" class="ad"/>
  <text x="1008" y="854" class="s">returns or reports back</text>
</svg>
